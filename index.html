<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Party 2025 QR Check</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
<style>
  /* ===== Global Styles ===== */
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #eef2f3, #8e9eab);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    color: #2c3e50;
    text-align: center;
  }

  h1 {
    margin-top: 15px;
    font-size: 1.8em;
    color: #1a237e;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
  }

  p {
    margin: 6px 0 20px 0;
    color: #37474f;
    font-size: 1.05em;
  }

  /* ===== QR Reader Box ===== */
  #reader {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 16px;
    border: 2px solid #d0d7de;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    margin: 0 auto 20px auto;
    overflow: hidden;
    transition: transform 0.2s ease;
  }

  #reader:hover {
    transform: scale(1.02);
  }

  /* ===== Status Box ===== */
  #statusBox {
    margin-top: 15px;
    padding: 15px 25px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1.1em;
    min-width: 260px;
    display: inline-block;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    transition: all 0.3s ease;
  }

  .invited {
    background: #e3fcef;
    color: #0f5132;
    border: 2px solid #0f5132;
  }

  .already {
    background: #fff3cd;
    color: #856404;
    border: 2px solid #856404;
  }

  .notinvited {
    background: #fdecea;
    color: #842029;
    border: 2px solid #842029;
  }

  /* ===== Buttons ===== */
  #scanAgainBtn {
    display: none;
    margin-top: 25px;
    padding: 12px 25px;
    font-size: 1em;
    border: none;
    border-radius: 10px;
    background-color: #3949ab;
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  #scanAgainBtn:hover {
    background-color: #283593;
    transform: translateY(-2px);
  }

  /* ===== Mobile Responsiveness ===== */
  @media (max-width: 480px) {
    h1 {
      font-size: 1.5em;
    }
    p {
      font-size: 0.95em;
    }
    #reader {
      width: 90%;
      max-width: 300px;
    }
    #statusBox {
      width: 90%;
      font-size: 1em;
    }
  }
</style>

</head>
<body>
  <h1>🎉 Welcome Party 2025 Entry Scanner</h1>
  <p>Scan a guest’s QR code to verify their invitation</p>

  <div id="reader"></div>
  <div id="statusBox">Ready to scan...</div>
  <button id="scanAgainBtn">🔄 Scan Again</button>

  <script>
    const webAppURL = "https://script.google.com/macros/s/AKfycbxmoVzXGhMkd5J_lJMQRw1VuBlW7AygFSGgJtxbsH5CLBLorSNFhXB65VenRMHIHvJX/exec";

    let html5QrCode;
    let scanning = true;

    function showStatus(type, msg) {
      const box = document.getElementById("statusBox");
      box.className = "";
      if (type) box.classList.add(type);
      box.textContent = msg;
    }

    async function handleResult(decodedText) {
      const code = decodedText.trim();
      if (!code) return;

      scanning = false;
      await html5QrCode.stop();
      html5QrCode.clear();
      showStatus("", "⏳ Checking...");
      document.getElementById("scanAgainBtn").style.display = "block";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000); // 3s timeout for faster response

      try {
        const res = await fetch(`${webAppURL}?code=${code}`, { mode: 'cors' });
		    const text = (await res.text()).trim();
		    console.log("Server Response:", text);

        console.log("Server response:", text);
        if (!text) {
          showStatus("notinvited", "❌ Not Invited!");
        } else if (text.startsWith("INVITED:")) {
          const name = text.split(":")[1] || "";
          showStatus("invited", `✅ Invited: ${name}`);
        } else if (text === "ALREADY_ENTERED" || text === "already") {
          showStatus("already", "⚠️ Already Entered!");
        } else if (text === "NOT_INVITED" || text === "notfound") {
          showStatus("notinvited", "❌ Not Invited!");
        } else {
          showStatus("notinvited", "❌ Not Invited!");
        }
      } catch (err) {
        console.error("Error fetching:", err);
        showStatus("notinvited", "❌ Not Invited!");
      }
    }

    async function startScanner() {
      document.getElementById("scanAgainBtn").style.display = "none";
      showStatus("", "📷 Initializing camera...");
      
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {
          console.warn("Old instance cleared:", e);
        }
      }

      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: 250 },
          async (decodedText) => {
            if (scanning) {
              scanning = false;
              await handleResult(decodedText);
            }
          },
          (err) => {}
        );
        showStatus("", "📷 Scanner ready. Point camera at QR code...");
      } catch (err) {
        console.error("Camera start failed:", err);
        showStatus("", "⚠️ Camera access denied or unavailable.");
      }
    }

    document.getElementById("scanAgainBtn").addEventListener("click", async () => {
      scanning = true;
      await startScanner();
    });

    startScanner();
  </script>
</body>
</html>
